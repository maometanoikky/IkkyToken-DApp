<svg xmlns="http://www.w3.org/2000/svg" width="850" height="700" viewBox="0 0 850 700">
  <defs>
    <!-- Solid Arrow Marker -->
    <marker id="arrow-solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#1e293b" />
    </marker>
    <!-- Drop Shadow Filter for UML Boxes -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#64748b" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />
  
  <!-- Title -->
  <text x="425" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="bold" fill="#0f172a" text-anchor="middle">UML Class Diagram: IkkyToken DApp (Database/Relational Style)</text>
  <text x="425" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" fill="#334155" text-anchor="middle">Merepresentasikan Struktur Class DApp &amp; Relasi State Mapping Solidity Sebagai Tabel Data</text>

  <!-- 1. Class: User / Aktor -->
  <g filter="url(#shadow)">
    <rect x="50" y="80" width="180" height="110" rx="4" fill="#f0f9ff" stroke="#0284c7" stroke-width="2" />
    <text x="140" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0369a1" text-anchor="middle">User / Aktor</text>
    <line x1="50" y1="108" x2="230" y2="108" stroke="#0284c7" stroke-width="1.5" />
    <text x="58" y="123" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#0f172a">+ walletAddress: address</text>
    <text x="58" y="137" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#0f172a">+ tokenBalance: uint256</text>
    <line x1="50" y1="145" x2="230" y2="145" stroke="#0284c7" stroke-width="1.5" />
    <text x="58" y="160" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#0369a1">+ connectWallet()</text>
    <text x="58" y="174" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#0369a1">+ transferToken()</text>
  </g>

  <!-- 2. Class: Owner / Developer (Inherits from User) -->
  <g filter="url(#shadow)">
    <rect x="50" y="240" width="180" height="130" rx="4" fill="#f0f9ff" stroke="#0284c7" stroke-width="2" />
    <text x="140" y="260" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0369a1" text-anchor="middle">Owner / Developer</text>
    <line x1="50" y1="268" x2="230" y2="268" stroke="#0284c7" stroke-width="1.5" />
    <text x="58" y="283" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#0f172a">+ isAdmin: bool</text>
    <line x1="50" y1="291" x2="230" y2="291" stroke="#0284c7" stroke-width="1.5" />
    <text x="58" y="306" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#0369a1">+ mint()</text>
    <text x="58" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#0369a1">+ setPauseStatus()</text>
    <text x="58" y="334" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#0369a1">+ manageBlacklist()</text>
    <text x="58" y="348" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#0369a1">+ renounceOwnership()</text>
  </g>

  <!-- Generalization (Inheritance) Line from Owner to User -->
  <!-- Hollow arrowhead pointing UP to User -->
  <line x1="140" y1="240" x2="140" y2="202" stroke="#0284c7" stroke-width="2" />
  <polygon points="140,190 134,202 146,202" fill="#ffffff" stroke="#0284c7" stroke-width="2" />

  <!-- 3. Class: IkkyTokenDApp (Frontend UI Controller) -->
  <g filter="url(#shadow)">
    <rect x="280" y="80" width="220" height="200" rx="4" fill="#f0fdfa" stroke="#0d9488" stroke-width="2" />
    <text x="390" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f766e" text-anchor="middle">IkkyTokenDApp (UI)</text>
    <line x1="280" y1="108" x2="500" y2="108" stroke="#0d9488" stroke-width="1.5" />
    <text x="288" y="123" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#0f172a">+ contractAddress: address</text>
    <text x="288" y="137" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#0f172a">+ userAddress: address</text>
    <text x="288" y="151" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#0f172a">+ tokenBalance: uint256</text>
    <text x="288" y="165" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#0f172a">+ totalSupply: uint256</text>
    <text x="288" y="179" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#0f172a">+ isPaused: bool</text>
    <line x1="280" y1="187" x2="500" y2="187" stroke="#0d9488" stroke-width="1.5" />
    <text x="288" y="202" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="bold" fill="#0f766e">+ connectWallet()</text>
    <text x="288" y="214" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="bold" fill="#0f766e">+ handleTransfer(to, amt)</text>
    <text x="288" y="226" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="bold" fill="#0f766e">+ handleMint(to, amt)</text>
    <text x="288" y="238" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="bold" fill="#0f766e">+ handlePause() / unpause()</text>
    <text x="288" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="bold" fill="#0f766e">+ handleBlacklist(acc)</text>
    <text x="288" y="262" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="bold" fill="#0f766e">+ handleRenounce()</text>
  </g>

  <!-- 4. Class: MetaMaskWallet (Web3 Wallet Interface) -->
  <g filter="url(#shadow)">
    <rect x="280" y="315" width="220" height="110" rx="4" fill="#fff7ed" stroke="#ea580c" stroke-width="2" />
    <text x="390" y="335" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#c2410c" text-anchor="middle">MetaMaskWallet</text>
    <line x1="280" y1="343" x2="500" y2="343" stroke="#ea580c" stroke-width="1.5" />
    <text x="288" y="358" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#0f172a">+ provider: Provider</text>
    <text x="288" y="372" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#0f172a">+ signer: Signer</text>
    <text x="288" y="386" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#0f172a">+ isConnected: bool</text>
    <line x1="280" y1="394" x2="500" y2="394" stroke="#ea580c" stroke-width="1.5" />
    <text x="288" y="409" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#c2410c">+ requestAccounts()</text>
  </g>

  <!-- 5. Class: IkkyToken (Solidity Smart Contract) -->
  <g filter="url(#shadow)">
    <rect x="550" y="80" width="250" height="340" rx="4" fill="#f5f3ff" stroke="#6366f1" stroke-width="2" />
    <text x="675" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#4f46e5" text-anchor="middle">IkkyToken (Smart Contract)</text>
    <line x1="550" y1="108" x2="800" y2="108" stroke="#6366f1" stroke-width="1.5" />
    <text x="558" y="123" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#0f172a">- _name: string</text>
    <text x="558" y="137" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#0f172a">- _symbol: string</text>
    <text x="558" y="151" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#0f172a">- _totalSupply: uint256</text>
    <text x="558" y="165" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#0f172a">- _owner: address</text>
    <text x="558" y="179" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#0f172a">- _paused: bool</text>
    <text x="558" y="193" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#0f172a">- _ownershipRenounced: bool</text>
    <line x1="550" y1="201" x2="800" y2="201" stroke="#6366f1" stroke-width="1.5" />
    <text x="558" y="216" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="bold" fill="#4f46e5">+ mint(to, amount)</text>
    <text x="558" y="228" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="bold" fill="#4f46e5">+ pause() / unpause()</text>
    <text x="558" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="bold" fill="#4f46e5">+ blacklist(account)</text>
    <text x="558" y="252" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="bold" fill="#4f46e5">+ unblacklist(account)</text>
    <text x="558" y="264" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="bold" fill="#4f46e5">+ isBlacklisted(acc): bool</text>
    <text x="558" y="276" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="bold" fill="#4f46e5">+ renounceOwnershipPermanently()</text>
    <text x="558" y="288" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="bold" fill="#4f46e5">+ transfer(to, value): bool</text>
    <text x="558" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="bold" fill="#4f46e5">+ transferFrom(from, to, val): bool</text>
    <text x="558" y="312" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="bold" fill="#4f46e5">+ balanceOf(account): uint256</text>
    <text x="558" y="324" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="bold" fill="#4f46e5">+ allowance(own, spnd): uint256</text>
    <text x="558" y="336" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="bold" fill="#4f46e5">+ approve(spender, value): bool</text>
    <text x="558" y="348" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="bold" fill="#4f46e5">+ isOwnershipRenounced(): bool</text>
  </g>

  <!-- 6. Class/Table: BalanceMapping (Database-like entry mapping balances) -->
  <g filter="url(#shadow)">
    <rect x="90" y="530" width="200" height="90" rx="4" fill="#f8fafc" stroke="#475569" stroke-width="2" />
    <text x="190" y="550" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e293b" text-anchor="middle">«Table» _balances</text>
    <line x1="90" y1="558" x2="290" y2="558" stroke="#475569" stroke-width="1.5" />
    <text x="98" y="573" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#0f172a">🔑 accountAddress: address</text>
    <text x="98" y="587" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#475569">   balance: uint256</text>
    <line x1="90" y1="595" x2="290" y2="595" stroke="#cbd5e1" stroke-width="1.2" />
    <text x="98" y="609" font-family="Segoe UI, Arial, sans-serif" font-size="8.5" font-weight="bold" font-style="italic" fill="#64748b">Solidity: address =&gt; uint256</text>
  </g>

  <!-- 7. Class/Table: AllowanceMapping (Database-like entry mapping allowances) -->
  <g filter="url(#shadow)">
    <rect x="320" y="530" width="210" height="110" rx="4" fill="#f8fafc" stroke="#475569" stroke-width="2" />
    <text x="425" y="550" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e293b" text-anchor="middle">«Table» _allowances</text>
    <line x1="320" y1="558" x2="530" y2="558" stroke="#475569" stroke-width="1.5" />
    <text x="328" y="573" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#0f172a">🔑 ownerAddress: address</text>
    <text x="328" y="587" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#0f172a">🔑 spenderAddress: address</text>
    <text x="328" y="601" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#475569">   amount: uint256</text>
    <line x1="320" y1="609" x2="530" y2="609" stroke="#cbd5e1" stroke-width="1.2" />
    <text x="328" y="623" font-family="Segoe UI, Arial, sans-serif" font-size="8.5" font-weight="bold" font-style="italic" fill="#64748b">Solidity: addr =&gt; (addr =&gt; uint)</text>
  </g>

  <!-- 8. Class/Table: BlacklistedMapping (Database-like entry mapping blacklist) -->
  <g filter="url(#shadow)">
    <rect x="560" y="530" width="200" height="90" rx="4" fill="#f8fafc" stroke="#475569" stroke-width="2" />
    <text x="660" y="550" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e293b" text-anchor="middle">«Table» _blacklisted</text>
    <line x1="560" y1="558" x2="760" y2="558" stroke="#475569" stroke-width="1.5" />
    <text x="568" y="573" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#0f172a">🔑 accountAddress: address</text>
    <text x="568" y="587" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#475569">   isBlacklisted: bool</text>
    <line x1="560" y1="595" x2="760" y2="595" stroke="#cbd5e1" stroke-width="1.2" />
    <text x="568" y="609" font-family="Segoe UI, Arial, sans-serif" font-size="8.5" font-weight="bold" font-style="italic" fill="#64748b">Solidity: address =&gt; bool</text>
  </g>

  <!-- RELATIONSHIP LINES WITH NAVIGATION ARROWS (using marker-end) -->

  <!-- User / Aktor -> IkkyTokenDApp -->
  <line x1="230" y1="135" x2="280" y2="135" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow-solid)" />
  <text x="242" y="127" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">1</text>
  <text x="268" y="127" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">1</text>
  <text x="255" y="149" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#475569" text-anchor="middle">Akses</text>

  <!-- IkkyTokenDApp -> MetaMaskWallet -->
  <line x1="390" y1="280" x2="390" y2="315" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow-solid)" />
  <text x="396" y="293" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">1</text>
  <text x="396" y="310" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">1</text>
  <text x="360" y="302" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#475569" text-anchor="middle">Memicu</text>

  <!-- MetaMaskWallet -> IkkyToken (Contract) -->
  <path d="M 500,370 L 525,370 L 525,250 L 550,250" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow-solid)" />
  <text x="506" y="362" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">1</text>
  <text x="542" y="242" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">1</text>
  <text x="529" y="310" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#475569" text-anchor="middle">Kirim Tx</text>

  <!-- IkkyTokenDApp -> IkkyToken (Contract) - Read Calls -->
  <line x1="500" y1="180" x2="550" y2="180" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow-solid)" />
  <text x="506" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">1</text>
  <text x="542" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">1</text>
  <text x="525" y="197" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#475569" text-anchor="middle">Read</text>

  <!-- MAPPINGS (COMPOSITION) FROM SMART CONTRACT -->
  <!-- Filled Diamond on Contract Side at bottom center (675, 420) -->
  <polygon points="675,420 670,425 675,430 680,425" fill="#1e293b" stroke="#1e293b" stroke-width="2" />
  <line x1="675" y1="430" x2="675" y2="480" stroke="#1e293b" stroke-width="2" />
  
  <!-- Composition Bus Line -->
  <line x1="190" y1="480" x2="675" y2="480" stroke="#1e293b" stroke-width="2" />
  
  <!-- Composition branch lines to Mapping classes -->
  <line x1="190" y1="480" x2="190" y2="530" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow-solid)" />
  <line x1="425" y1="480" x2="425" y2="530" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow-solid)" />
  <line x1="660" y1="480" x2="660" y2="530" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow-solid)" />

  <text x="685" y="442" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">1</text>
  <text x="198" y="500" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">0..*</text>
  <text x="433" y="500" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">0..*</text>
  <text x="668" y="500" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">0..*</text>

  <!-- FOREIGN KEY LOGICAL REFERENCES (Dashed arrows from Mappings to User) -->
  <!-- Represents that accountAddress / ownerAddress references walletAddress -->

  <!-- FK: _balances -> User -->
  <path d="M 90,580 L 30,580 L 30,135 L 50,135" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-solid)" />
  <text x="35" y="573" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="bold" fill="#475569">FK: accountAddress</text>

  <!-- FK: _allowances -> User -->
  <path d="M 320,600 L 20,600 L 20,120 L 50,120" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-solid)" />
  <text x="25" y="593" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="bold" fill="#475569">FK: ownerAddress</text>

  <!-- FK: _blacklisted -> User -->
  <path d="M 760,580 L 820,580 L 820,60 L 140,60 L 140,73" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-solid)" />
  <text x="765" y="573" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="bold" fill="#475569">FK: accountAddress</text>

</svg>
