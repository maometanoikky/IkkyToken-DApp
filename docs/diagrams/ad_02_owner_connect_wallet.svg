<svg xmlns="http://www.w3.org/2000/svg" width="850" height="660" viewBox="0 0 850 660">
  <defs>
    <!-- Solid Arrow Marker -->
    <marker id="arrow-solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#0f172a" />
    </marker>
    <!-- Drop Shadow Filter for Swimlanes -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#94a3b8" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />
  
  <!-- Title -->
  <text x="425" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">AD-02: Owner Menghubungkan Wallet Metamask</text>

  <!-- Swimlane Header Backgrounds -->
  <rect x="50" y="50" width="180" height="40" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <rect x="230" y="50" width="190" height="40" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <rect x="420" y="50" width="190" height="40" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <rect x="610" y="50" width="190" height="40" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Swimlane Header Texts -->
  <text x="140" y="75" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Aktor (Owner / Developer)</text>
  <text x="325" y="75" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f766e" text-anchor="middle">Frontend DApp (UI)</text>
  <text x="515" y="75" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#c2410c" text-anchor="middle">MetaMask Wallet</text>
  <text x="705" y="75" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#4f46e5" text-anchor="middle">Smart Contract</text>

  <!-- Swimlane Vertical Boundaries -->
  <line x1="50" y1="90" x2="50" y2="630" stroke="#cbd5e1" stroke-width="1.5" />
  <line x1="230" y1="90" x2="230" y2="630" stroke="#cbd5e1" stroke-width="1.5" />
  <line x1="420" y1="90" x2="420" y2="630" stroke="#cbd5e1" stroke-width="1.5" />
  <line x1="610" y1="90" x2="610" y2="630" stroke="#cbd5e1" stroke-width="1.5" />
  <line x1="800" y1="90" x2="800" y2="630" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Start Node -->
  <circle cx="140" cy="115" r="9" fill="#0f172a" />
  <line x1="140" y1="124" x2="140" y2="145" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow-solid)" />

  <!-- Action 1: Klik Connect Wallet -->
  <g filter="url(#shadow)">
    <rect x="60" y="145" width="160" height="40" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.8" />
    <text x="140" y="169" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#0f172a" text-anchor="middle">Klik "Connect Wallet"</text>
  </g>
  <line x1="220" y1="165" x2="245" y2="165" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow-solid)" />

  <!-- Action 2: Request MetaMask Account -->
  <g filter="url(#shadow)">
    <rect x="245" y="145" width="160" height="40" rx="6" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.8" />
    <text x="325" y="169" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#0f172a" text-anchor="middle">Request Akun Wallet</text>
  </g>
  <line x1="405" y1="165" x2="435" y2="165" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow-solid)" />

  <!-- Action 3: Tampilkan Jendela Pop-up -->
  <g filter="url(#shadow)">
    <rect x="435" y="145" width="160" height="40" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8" />
    <text x="515" y="169" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#0f172a" text-anchor="middle">Tampilkan Pop-up</text>
  </g>
  
  <!-- Arrow from MetaMask popup back to User's decision node -->
  <path d="M 515,185 L 515,225 L 180,225" fill="none" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow-solid)" />

  <!-- Decision 1: Setujui Koneksi? -->
  <g>
    <polygon points="140,200 180,225 140,250 100,225" fill="#fef9c3" stroke="#d97706" stroke-width="1.8" />
    <text x="140" y="229" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">Setuju?</text>
  </g>

  <!-- Decision 1 Branch: NO -->
  <line x1="100" y1="225" x2="80" y2="225" stroke="#0f172a" stroke-width="1.5" />
  <line x1="80" y1="225" x2="80" y2="275" stroke="#0f172a" stroke-width="1.5" />
  <line x1="80" y1="275" x2="128" y2="275" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow-solid)" />
  <text x="85" y="218" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#ef4444">Tidak</text>

  <!-- End Node (Gagal) -->
  <g>
    <circle cx="140" cy="275" r="9" fill="none" stroke="#0f172a" stroke-width="1.5" />
    <circle cx="140" cy="275" r="5" fill="#0f172a" />
  </g>

  <!-- Decision 1 Branch: YES -->
  <line x1="140" y1="250" x2="140" y2="290" stroke="#0f172a" stroke-width="1.5" />
  <line x1="140" y1="290" x2="435" y2="290" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow-solid)" />
  <text x="148" y="265" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#22c55e">Ya</text>

  <!-- Action 4: Return Alamat Wallet -->
  <g filter="url(#shadow)">
    <rect x="435" y="270" width="160" height="40" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8" />
    <text x="515" y="294" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#0f172a" text-anchor="middle">Kirim Alamat &amp; Signer</text>
  </g>
  <line x1="595" y1="290" x2="625" y2="290" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow-solid)" />

  <!-- Action 5: Cek Owner & Saldo -->
  <g filter="url(#shadow)">
    <rect x="625" y="270" width="160" height="40" rx="6" fill="#f5f3ff" stroke="#6366f1" stroke-width="1.8" />
    <text x="705" y="294" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#0f172a" text-anchor="middle">Cek Status &amp; Saldo</text>
  </g>
  
  <!-- Arrow from Smart Contract to Frontend DApp Action 6 -->
  <path d="M 705,310 L 705,360 L 405,360" fill="none" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow-solid)" />

  <!-- Action 6: Terima Data dari Blockchain -->
  <g filter="url(#shadow)">
    <rect x="245" y="340" width="160" height="40" rx="6" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.8" />
    <text x="325" y="364" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#0f172a" text-anchor="middle">Terima Data Respon</text>
  </g>
  <line x1="325" y1="380" x2="325" y2="400" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow-solid)" />

  <!-- Decision 2: Apakah Owner? -->
  <g>
    <polygon points="325,400 365,425 325,450 285,425" fill="#fef9c3" stroke="#d97706" stroke-width="1.8" />
    <text x="325" y="429" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">Owner?</text>
  </g>

  <!-- Decision 2 Branch: YES (Ya) -> Tampilkan Panel Admin (L-routing) -->
  <path d="M 285,425 L 200,425 L 200,485 L 245,485" fill="none" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow-solid)" />
  <text x="230" y="418" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#22c55e">Ya</text>

  <!-- Action 7: Tampilkan Panel Admin (Diakses jika login sebagai owner) -->
  <g filter="url(#shadow)">
    <rect x="245" y="465" width="160" height="40" rx="6" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.8" />
    <text x="325" y="489" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#0f172a" text-anchor="middle">Tampilkan Panel Admin</text>
  </g>
  
  <!-- Decision 2 Branch: NO (Tidak) -> Tampilkan Dashboard User -->
  <line x1="325" y1="450" x2="325" y2="525" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow-solid)" />
  <text x="333" y="458" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#ef4444">Tidak</text>

  <!-- Action 8: Tampilkan Dashboard User (Biasa) -->
  <g filter="url(#shadow)">
    <rect x="245" y="525" width="160" height="40" rx="6" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.8" />
    <text x="325" y="549" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#0f172a" text-anchor="middle">Tampilkan Dashboard User</text>
  </g>

  <!-- Connect both paths to final End Node -->
  <!-- Action 8 goes straight down to End Node -->
  <line x1="325" y1="565" x2="325" y2="595" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow-solid)" />
  
  <!-- Action 7 (Panel Admin) routes around Action 8 to End Node -->
  <path d="M 405,485 L 415,485 L 415,605 L 334,605" fill="none" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow-solid)" />

  <!-- End Node (Sukses) -->
  <g>
    <circle cx="325" cy="605" r="9" fill="none" stroke="#0f172a" stroke-width="1.5" />
    <circle cx="325" cy="605" r="5" fill="#0f172a" />
  </g>
</svg>
