<svg xmlns="http://www.w3.org/2000/svg" width="850" height="924" viewBox="0 0 850 924">
  <defs>
    <!-- Solid Arrow Marker -->
    <marker id="arrow-solid" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#0f172a" />
    </marker>
    <!-- Return Arrow Marker -->
    <marker id="arrow-return" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#334155" />
    </marker>
    <!-- Drop Shadow Filter for Lifelines -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#94a3b8" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />
  
  <!-- Diagram Title -->
  <text x="425" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">SD-08: Owner Melepaskan Kepemilikan Permanent (Renounce)</text>

  <!-- Lifeline Vertical Dashed Lines (Start at y1=90 to avoid crossing boxes) -->
  <line x1="80" y1="90" x2="80" y2="1140" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4" />
  <line x1="280" y1="90" x2="280" y2="1140" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4" />
  <line x1="480" y1="90" x2="480" y2="1140" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4" />
  <line x1="680" y1="90" x2="680" y2="1140" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4" />

  <!-- Lifeline Boxes -->
  <!-- 1. Actor -->
  <g filter="url(#shadow)">
    <rect x="20" y="50" width="120" height="40" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2" />
    <text x="80" y="74" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Owner / Developer</text>
  </g>
  <!-- 2. Frontend DApp -->
  <g filter="url(#shadow)">
    <rect x="220" y="50" width="120" height="40" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2" />
    <text x="280" y="74" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Frontend DApp</text>
  </g>
  <!-- 3. MetaMask -->
  <g filter="url(#shadow)">
    <rect x="420" y="50" width="120" height="40" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2" />
    <text x="480" y="74" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">MetaMask Wallet</text>
  </g>
  <!-- 4. Smart Contract -->
  <g filter="url(#shadow)">
    <rect x="620" y="50" width="120" height="40" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2" />
    <text x="680" y="74" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Smart Contract</text>
  </g>

  <!-- Activation Bars (Focus of Control) -->
  <rect x="75" y="100" width="10" height="743" fill="#e2e8f0" stroke="#475569" stroke-width="1" />
  <rect x="275" y="100" width="10" height="743" fill="#e2e8f0" stroke="#475569" stroke-width="1" />
  <rect x="475" y="249" width="10" height="486" fill="#e2e8f0" stroke="#475569" stroke-width="1" />
  <rect x="675" y="519" width="10" height="162" fill="#e2e8f0" stroke="#475569" stroke-width="1" />

  <!-- Messages & Self-Calls -->
  
  <!-- 1. Klik Renounce -->
  <g>
    <line x1="85" y1="114" x2="275" y2="114" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow-solid)" />
    <text x="180" y="104" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">1. Klik "Renounce Ownership Permanently"</text>
  </g>

  <!-- 2. Pop-up Peringatan Keras -->
  <g>
    <line x1="275" y1="161" x2="85" y2="161" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow-solid)" />
    <text x="180" y="151" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">2. Tampilkan Pop-up Peringatan Keras (Ireversibel)</text>
  </g>

  <!-- 3. Konfirmasi Setuju -->
  <g>
    <line x1="85" y1="208" x2="275" y2="208" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow-solid)" />
    <text x="180" y="199" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">3. Klik Setuju &amp; Konfirmasi Risiko</text>
  </g>

  <!-- 4. Panggil Fungsi Smart Contract via MetaMask -->
  <g>
    <line x1="285" y1="255" x2="475" y2="255" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow-solid)" />
    <text x="380" y="246" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">4. Panggil renounceOwnershipPermanently()</text>
  </g>

  <!-- 5. Tampilkan Konfirmasi MetaMask -->
  <g>
    <line x1="475" y1="303" x2="85" y2="303" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow-solid)" />
    <text x="280" y="293" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">5. Tampilkan Konfirmasi Transaksi MetaMask</text>
  </g>

  <!-- 6. Konfirmasi Transaksi (Approve) -->
  <g>
    <line x1="85" y1="357" x2="475" y2="357" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow-solid)" />
    <text x="280" y="347" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">6. Setujui Transaksi (Sign)</text>
  </g>

  <!-- 7. Return Transaction Hash (txHash) -->
  <g>
    <line x1="475" y1="411" x2="285" y2="411" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-return)" />
    <text x="380" y="401" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">7. Return Transaction Hash (txHash)</text>
  </g>

  <!-- 8. Tampilkan Status Pending di UI -->
  <g>
    <line x1="275" y1="458" x2="85" y2="458" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-return)" />
    <text x="180" y="448" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">8. Tampilkan Status "Pending"</text>
  </g>

  <!-- 9. Kirim Transaksi ke Blockchain -->
  <g>
    <line x1="485" y1="532" x2="675" y2="532" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow-solid)" />
    <text x="580" y="523" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">9. Eksekusi renounceOwnershipPermanently()</text>
  </g>

  <!-- 10. Modifier Check & Check State -->
  <g>
    <path d="M 685,552 C 715,552 715,579 685,579" fill="none" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow-solid)" />
    <text x="720" y="571" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#0f172a" text-anchor="start">10. Cek onlyOwner &amp; status</text>
  </g>

  <!-- 11. Set owner = 0x0 & _ownershipRenounced = true -->
  <g>
    <path d="M 685,606 C 715,606 715,633 685,633" fill="none" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow-solid)" />
    <text x="720" y="625" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#0f172a" text-anchor="start">11. Set Owner = 0x0 &amp; Emit Event</text>
  </g>

  <!-- 12. Transaksi Mined -->
  <g>
    <line x1="675" y1="681" x2="485" y2="681" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-return)" />
    <text x="580" y="671" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">12. Transaksi Mined</text>
  </g>

  <!-- 13. Kirim Resi Transaksi (Receipt) -->
  <g>
    <line x1="475" y1="728" x2="285" y2="728" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-return)" />
    <text x="380" y="718" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">13. Kirim Resi Transaksi (Receipt)</text>
  </g>

  <!-- 14. Self Update UI: Sembunyikan Panel & Set status Desentralisasi -->
  <g>
    <path d="M 285,762 C 315,762 315,789 285,789" fill="none" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow-solid)" />
    <text x="320" y="780" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#0f172a" text-anchor="start">14. Sembunyikan Admin Panel, set owner = 0x0</text>
  </g>

  <!-- 15. Tampilkan Notifikasi Sukses -->
  <g>
    <line x1="275" y1="836" x2="85" y2="836" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-return)" />
    <text x="180" y="826" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">15. Tampilkan Notifikasi Sukses</text>
  </g>
</svg>
